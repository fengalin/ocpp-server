<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Charge System">
  <!-- "your charge point, and everything that orbits it" -->
  <!-- orbit ring -->
  <ellipse cx="60" cy="60" rx="52" ry="20" transform="rotate(-24 60 60)"
           fill="none" stroke="#8b98a5" stroke-width="2.5" opacity="0.55"/>
  <!-- satellite: the schedule -->
  <circle cx="103" cy="35" r="4.5" fill="#5aa9e6"/>
  <!-- charge point body -->
  <rect x="43" y="24" width="34" height="52" rx="8" fill="#2c313a"/>
  <!-- display: lightning bolt -->
  <path d="M63.5 31 L52 49 h7 L55.5 66 L70 45 h-8 l7.5 -14 z" fill="#e6b45a"/>
  <!-- charging cable -->
  <path d="M60 76 C60 88 74 84 74 96" fill="none" stroke="#2c313a"
        stroke-width="6" stroke-linecap="round"/>
  <!-- ground bar -->
  <rect x="36" y="96" width="28" height="6" rx="3" fill="#2c313a"/>
  <!-- satellite: a charging session -->
  <circle cx="38" cy="106" r="3.5" fill="#4cc38a"/>
</svg>
