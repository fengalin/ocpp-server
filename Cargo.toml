[package]
name = "ocpp-server"
version = "0.1.0"
edition = "2024"

[features]
default = []
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
env_logger = "0.11.11"
futures = "0.3.33"
log = "0.4.33"
ocpp_rs = "0.4.1"
rusqlite = { version = "0.40.2", features = ["chrono"] }
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1"

[profile.release-slim]
inherits = "release"
strip = "symbols"
lto = "fat"
panic = "abort"
codegen-units = 1
