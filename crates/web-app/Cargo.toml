[package]
name = "web-app"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3"
charge-system-common-model = { path = "../common_model" }
charge-system-web-model = { path = "../web_model" }
serde = { version = "^1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
chrono = "0.4.45"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "EventSource",
    "Event",
    "MessageEvent",
    "KeyboardEvent",
    "MouseEvent",
    "PointerEvent",
    "HtmlInputElement",
    "HtmlButtonElement",
    "DomTokenList",
    "console",
    "Node",
    "NodeList",
    "EventTarget",
    "Request",
    "RequestInit",
    "Response",
    "Headers",
    "Storage",
    "CssStyleDeclaration",
    "DomRect",
    "WheelEvent",
    "AddEventListenerOptions",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"
